<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이 몸이 얼마짜린데 · 습관 만들기</title>
<meta name="description" content="또 작심삼일? 이번엔 딱 하나만. 습관을 한 번에 하나씩 만드는 iPhone 앱이에요.">
<meta property="og:title" content="이 몸이 얼마짜린데 · 습관 만들기">
<meta property="og:description" content="또 작심삼일? 이번엔 딱 하나만">
<meta name="apple-itunes-app" content="app-id=6815178497">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F2F4F3;--fg:#1B252E;--mute:#6b7680;--btn:#1B252E;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0E1114;--fg:#EEF1F0;--mute:#98a1a8;--btn:#EEF1F0;--btnfg:#0E1114}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:420px;margin:0 auto;padding:72px max(24px,env(safe-area-inset-left)) 48px;text-align:center}
.app{font-size:12px;letter-spacing:.04em;color:var(--mute)}
h1{font-family:"Iowan Old Style","Apple SD Gothic Neo",Georgia,serif;font-weight:400;font-size:30px;line-height:1.3;margin:28px 0 10px;word-break:keep-all}
p{font-size:15px;line-height:1.7;color:var(--mute);margin:0}
.btn{display:block;background:var(--btn);color:var(--btnfg);text-decoration:none;font-size:16px;padding:17px 0;margin-top:32px}
</style>
</head>
<body>
<main>
  <div class="app">이 몸이 얼마짜린데</div>
  <h1>또 작심삼일?<br>이번엔 딱 하나만.</h1>
  <p>습관을 한 번에 하나씩.<br>달성한 날마다 잎 한 장, 서른 장이면 완성이에요.</p>
  <a class="btn" href="https://apps.apple.com/kr/app/id6815178497">App Store에서 받기</a>
</main>
</body>
</html>
